<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f4"><link rel="manifest" href="manifest.webmanifest"><title>우리생활</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#242a31;background:#f8f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:600px;margin:auto;padding:24px 18px 100px}h1{font-size:25px;margin:4px 0 3px}h2{font-size:17px;margin:0 0 14px}.muted{color:#78818a;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.tag{background:#e8efe9;color:#426b53;padding:7px 11px;border-radius:30px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{background:white;border:1px solid #e9e9e6;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 2px 10px #17211a05}.grid .card{margin:0}.value{font-size:21px;font-weight:750;letter-spacing:-.7px;margin:8px 0 3px}.section{margin-top:24px}.entry{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0ed;gap:8px}.entry:last-child{border:0}.entry b{font-size:14px}.entry small{display:block;color:#879098;margin-top:4px}.amount{white-space:nowrap;font-weight:650}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ececea;display:flex;justify-content:center;padding:10px 5px max(12px,env(safe-area-inset-bottom))}.tabs-inner{display:flex;width:min(600px,100%)}.tabs button{flex:1;border:0;background:none;color:#8b9297;padding:8px 2px;font-size:12px}.tabs button.active{color:#245c43;font-weight:800}.tabs span{display:block;font-size:20px;margin-bottom:3px}button.primary{background:#285c47;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}button.ghost{background:#eef3ef;color:#285c47;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}button.danger{background:none;color:#ad4a4a;border:0;cursor:pointer}input,select,textarea{width:100%;border:1px solid #dce1dd;border-radius:11px;padding:12px;font:inherit;background:white;margin:5px 0 12px}label{font-size:13px;font-weight:650}form{margin-top:10px}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.progress{height:8px;background:#edf0eb;border-radius:12px;overflow:hidden}.progress div{height:100%;background:#77a78b}.pill{font-size:11px;background:#f1f4f1;border-radius:20px;padding:5px 8px;color:#5e7164}.notice{background:#fff8e9;border:1px solid #f4e7ca;border-radius:13px;padding:13px;font-size:12px;line-height:1.6;color:#78623a;margin-top:12px}.empty{padding:18px;text-align:center;color:#899099;font-size:13px}textarea{min-height:90px}input[type=checkbox]{width:auto;margin:0 8px 0 0} .checkline{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:14px} .checkline span{flex:1}.full{width:100%}
</style></head><body><main><header class="top"><div><div class="muted">우리 둘의 생활을 한곳에</div><h1>우리생활 🌿</h1></div><div class="tag">무료 로컬 버전</div></header><div id="page"></div><div class="notice">현재 버전은 이 기기에만 저장됩니다. 2인 실시간 공유·로그인·기기간 동기화는 아직 지원하지 않습니다. 개인정보가 포함된 기기에서는 백업 파일 관리에 주의하세요.</div></main><nav class="tabs"><div class="tabs-inner"><button data-tab="home"><span>⌂</span>홈</button><button data-tab="ledger"><span>▤</span>가계부</button><button data-tab="assets"><span>◉</span>자산</button><button data-tab="travel"><span>✈</span>여행</button><button data-tab="settings"><span>⚙</span>설정</button></div></nav><script>
const KEY='ourlife_v1';const seed={expenses:[],accounts:[],trips:[],budget:1000000,income:0,fixed:0,saving:0};let data;try{data={...seed,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=structuredClone(seed)}let tab='home';const $=s=>document.querySelector(s),won=n=>'₩'+Math.round(Number(n)||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function month(){return new Date().toISOString().slice(0,7)}function total(xs){return xs.reduce((s,x)=>s+(Number(x.amount)||0),0)}function current(){return data.expenses.filter(x=>x.date.slice(0,7)===new Date().toLocaleDateString('sv-SE').slice(0,7))}function card(s){return '<div class="card">'+s+'</div>'}function field(label,name,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`}function expenseList(items){return items.length?items.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry"><div><b>${esc(x.name)}</b><small>${esc(x.date)} · ${esc(x.category)} · ${x.scope==='shared'?'공동':'개인'}</small></div><div class="row"><span class="amount">-${won(x.amount)}</span><button class="danger" data-delete="expense:${esc(x.id)}" aria-label="삭제">×</button></div></div>`).join(''):'<div class="empty">등록된 내역이 없습니다.</div>'}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let e=current(),shared=total(e.filter(x=>x.scope==='shared')),personal=total(e.filter(x=>x.scope==='private')),remain=data.budget-shared,available=Math.max(0,data.income-data.fixed-personal-data.saving);let out='';if(tab==='home'){out=`<div class="grid">${card(`<div class="muted">이번 달 공동 지출</div><div class="value">${won(shared)}</div><div class="muted">예산 ${won(data.budget)}</div>`)}${card(`<div class="muted">공동 예산 잔액</div><div class="value">${won(remain)}</div><div class="muted">예산 대비 ${data.budget?Math.round(shared/data.budget*100):0}% 사용</div>`)}</div><div class="section">${card(`<h2>공동생활비 예산</h2><div class="progress"><div style="width:${Math.min(100,data.budget?shared/data.budget*100:0)}%"></div></div><p class="muted">현재 등록된 공동 지출을 기준으로 계산합니다.</p>`)}</div><div class="section">${card(`<div class="row"><h2>최근 지출</h2><button class="ghost" data-go="ledger">전체 보기</button></div>${expenseList(e.slice(0,5))}`)}</div>`}if(tab==='ledger'){out=card(`<h2>지출 등록</h2><form id="expenseForm">${field('사용 날짜','date','date',`value="${new Date().toLocaleDateString('sv-SE')}"`)}${field('내역','name','text','placeholder="예: 장보기"')}${field('금액 (원)','amount','number','min="1" step="1"')}<label>구분<select name="scope"><option value="shared">공동생활비</option><option value="private">개인지출 (이 기기에서만)</option></select></label><label>분류<select name="category"><option>식비</option><option>주거</option><option>교통</option><option>쇼핑</option><option>여가</option><option>기타</option></select></label><button class="primary full">지출 저장</button></form>`)+card(`<div class="row"><h2>이번 달 지출</h2><span class="pill">공동 ${won(shared)} / 개인 ${won(personal)}</span></div>${expenseList(e)}`)}if(tab==='assets'){let assets=total(data.accounts);out=card(`<h2>개인 자산 현황</h2><div class="value">${won(assets)}</div><div class="muted">등록한 계좌 잔액 합계 · 이 기기에서만 보관</div>`)+card(`<h2>계좌 추가</h2><form id="accountForm">${field('계좌 별칭','name','text','placeholder="예: 생활비 통장"')}${field('현재 잔액 (원)','amount','number','step="1"')}<button class="primary full">계좌 저장</button></form>`)+card(`<h2>내 계좌</h2>${data.accounts.length?data.accounts.map(x=>`<div class="entry"><b>${esc(x.name)}</b><div class="row"><span>${won(x.amount)}</span><button class="danger" data-delete="account:${esc(x.id)}">×</button></div></div>`).join(''):'<div class="empty">등록된 계좌가 없습니다.</div>'}`)+card(`<h2>예산 및 적금 계획</h2><form id="planForm">${field('월 예상 수입','income','number',`min="0" value="${data.income}"`)}${field('월 고정 지출','fixed','number',`min="0" value="${data.fixed}"`)}${field('월 적금 목표','saving','number',`min="0" value="${data.saving}"`)}${field('월 공동생활비 예산','budget','number',`min="0" value="${data.budget}"`)}<button class="primary full">계획 저장</button></form><div class="section"><div class="muted">적금 목표 제외 후 남는 금액 (이번 달 개인지출 차감)</div><div class="value">${won(data.income-data.fixed-personal-data.saving)}</div><div class="muted">공동생활비 분담액은 월 고정 지출에 직접 반영하세요. 계좌 잔액과 수입은 자동 연동되지 않습니다.</div></div>`)}if(tab==='travel'){out=card(`<h2>새 여행 만들기</h2><form id="tripForm">${field('여행 이름','name','text','placeholder="예: 상하이 여행"')}${field('출발일','start','date')}${field('귀국일','end','date')}<button class="primary full">여행 저장</button></form>`)+data.trips.map(t=>card(`<div class="row"><h2>${esc(t.name)}</h2><button class="danger" data-delete="trip:${esc(t.id)}">삭제</button></div><div class="muted">${esc(t.start)} ~ ${esc(t.end)}</div><form class="tripItemForm" data-id="${esc(t.id)}"><label>일정 또는 준비물 추가<input name="item" placeholder="예: 여권 챙기기 / 1일차 외탄" required></label><button class="ghost">추가</button></form>${(t.items||[]).map((it,i)=>`<label class="checkline"><input type="checkbox" data-check="${esc(t.id)}:${i}" ${it.done?'checked':''}><span style="${it.done?'text-decoration:line-through;color:#999':''}">${esc(it.text)}</span><button class="danger" data-itemdelete="${esc(t.id)}:${i}" type="button">×</button></label>`).join('')}`)).join('')+(!data.trips.length?'<div class="empty">여행을 만들면 일정과 준비물을 관리할 수 있습니다.</div>':'')}if(tab==='settings'){out=card(`<h2>데이터 백업</h2><p class="muted">JSON 파일로 내보내거나 복원할 수 있습니다. 파일에는 지출·자산 등 개인 정보가 포함됩니다.</p><button class="primary" id="export">백업 파일 저장</button><label style="display:block;margin-top:18px">백업 파일 불러오기<input id="import" type="file" accept="application/json,.json"></label>`)+card(`<h2>현재 버전 안내</h2><p class="muted">앱 설치 후 오프라인으로도 사용할 수 있습니다. 기기 변경 시 백업 파일을 이용해야 합니다. 공동 가계부 실시간 동기화는 Firebase 연결 이후 제공됩니다.</p>`)}$('#page').innerHTML=out}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();window.scrollTo(0,0)}let g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;render()}let d=e.target.closest('[data-delete]');if(d&&confirm('이 항목을 삭제하시겠습니까?')){let [type,id]=d.dataset.delete.split(':');let k={expense:'expenses',account:'accounts',trip:'trips'}[type];data[k]=data[k].filter(x=>x.id!==id);save()}let it=e.target.closest('[data-itemdelete]');if(it){let [id,i]=it.dataset.itemdelete.split(':');data.trips.find(t=>t.id===id)?.items.splice(Number(i),1);save()}if(e.target.id==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='우리생활-백업-'+new Date().toLocaleDateString('sv-SE')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}});document.addEventListener('change',async e=>{let c=e.target.closest('[data-check]');if(c){let [id,i]=c.dataset.check.split(':');data.trips.find(t=>t.id===id).items[Number(i)].done=c.checked;save()}if(e.target.id==='import'){try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.expenses)||!Array.isArray(obj.accounts)||!Array.isArray(obj.trips))throw Error('형식 오류');if(confirm('현재 데이터를 백업 파일 내용으로 교체하시겠습니까?')){data={...seed,...obj};save()}}catch(err){alert('올바른 백업 파일을 읽지 못했습니다.')}}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='expenseForm'){if(Number(v.amount)<=0)return alert('금액을 확인하세요');data.expenses.push({...v,amount:Number(v.amount),id:crypto.randomUUID()})}if(f.id==='accountForm')data.accounts.push({...v,amount:Number(v.amount),id:crypto.randomUUID()});if(f.id==='planForm')for(let k of ['income','fixed','saving','budget'])data[k]=Math.max(0,Number(v[k])||0);if(f.id==='tripForm'){if(v.end<v.start)return alert('날짜를 확인하세요');data.trips.push({...v,id:crypto.randomUUID(),items:[]})}if(f.classList.contains('tripItemForm'))data.trips.find(t=>t.id===f.dataset.id).items.push({text:v.item,done:false});save()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
